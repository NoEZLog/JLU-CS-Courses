    html += '</div>';
    html += '<div class="chapter-toggle">&#9660;</div>';
    html += '</div>';
    html += '<div class="chapter-body"><ul class="video-list">';
    ch.videos.forEach(function(v) {
      globalIndex++;
      html += '<li class="video-item">';
      html += '<span class="v-index">P' + globalIndex + '</span>';
      html += '<span class="v-title">' + v.t + '</span>';
      html += '<span class="v-duration">' + v.d + '</span>';
      html += '<a class="v-link" href="' + BASE_URL + globalIndex + '" target="_blank" rel="noopener">&#9654; 播放</a>';
      html += '</li>';
    });
    html += '</ul></div></div>';
  });
  document.getElementById('chapters').innerHTML = html;
})();

function toggleChapter(header) {
  var chapter = header.parentElement;
  chapter.classList.toggle('open');
}

// Smooth scroll for nav links
document.querySelectorAll('.toc-list a').forEach(function(a) {
  a.addEventListener('click', function(e) {
    e.preventDefault();
    var target = document.querySelector(this.getAttribute('href'));
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
});
</script>
</body>
</html>
